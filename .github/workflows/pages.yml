name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Ordnerstruktur pruefen
        run: python werkzeuge/struktur_pruefen.py

      - name: Site bauen
        run: python werkzeuge/build_site.py

      - name: Site pruefen
        run: python werkzeuge/site_pruefen.py

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
