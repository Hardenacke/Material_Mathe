function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}

function adaptivePatterns(){

 ranked.sort((a,b)=>(a.mastery??0.55)-(b.mastery??0.55));

 if(state.mode==='training'&&!state.roundSaved){saveTrainingRound();saveLocalLeaderboard();state.roundSaved=true}
 setRoute('result');clearInterval(state.timer);clearInterval(state.roundClock);
 if(state.mode==='competition'){try{localStorage.removeItem('matheQuizRound:'+QUIZ.id)}catch{}}
 document.body.classList.remove('in-task');
 const isTraining=state.mode==='training',total=isTraining?10:12,elapsed=state.roundStartedAt?Math.floor((Date.now()-state.roundStartedAt)/1000):0,mins=Math.floor(elapsed/60),secs=elapsed%60;
 view.innerHTML='<section class="card result"><div class="badge">'+(state.correct===total?'🌟 Starke Runde!':'🎉 Runde geschafft!')+'</div><h1>Dein Ergebnis</h1><div class="big"><span data-math="'+state.score+'"></span> Punkte</div><p><span data-math="'+state.correct+'"></span> von <span data-math="'+total+'"></span> Aufgaben richtig.</p>'+(isTraining?'<p>Beste Serie: <strong><span data-math="'+state.bestStreak+'"></span> richtig hintereinander</strong>.</p>':'<p>Grundpunkte: <strong><span data-math="'+state.basePoints+'"></span></strong> · Zeitbonus: <strong><span data-math="'+state.timeBonus+'"></span></strong></p><p>Rundenzeit: <strong>'+mins+':'+String(secs).padStart(2,'0')+' min</strong></p>')+'<p>'+(state.mode==='competition'?'Dein Ergebnis wurde an den Wettbewerbsserver übermittelt.':'Dein Lernfortschritt wurde lokal gespeichert.')+'</p>'+(isTraining?'<div id="roundFeedback"></div>':'')+'<div class="action-row"><button class="secondary" id="again">Noch eine Runde</button><button class="primary" id="resultRank">Quiz-Rangliste</button><button class="secondary" id="resultHome">Zur Auswahl</button></div></section>';
 safeTex(view);if(isTraining)renderTrainingFeedback();$('#again').onclick=state.mode==='training'?()=>levels():contestForm;$('#resultRank').onclick=leaderboard;$('#resultHome').onclick=home
}
function contestForm(){if(!CLOUD.enabled||!CLOUD.baseUrl||!state.apiOnline){home();return}setRoute('competition');document.body.classList.remove('in-task');state.mode='competition';view.innerHTML=`<section class="card"><h2>Wettbewerb vorbereiten</h2><p>Kein Konto nötig. Ein Name oder Pseudonym ist freiwillig und auf der Rangliste sichtbar. Verwende dort keinen vollen Namen. Ohne Eingabe erhältst du einen automatisch erzeugten Namen. Gespielt wird in Klasse ${math(QUIZ.grade,0)}.</p><form class="contest-form" id="contestForm"><label>Name oder Pseudonym (optional)<input name="name" maxlength="24" autocomplete="nickname"></label><button class="primary" type="submit">Wettbewerbsrunde starten</button></form><button class="secondary" id="otherPerson" type="button">Andere Person an diesem Gerät</button><p class="helper">Zwölf Aufgaben. Die Bearbeitungszeit startet für jede Aufgabe serverseitig. Eine laufende Runde kann im selben Browser fortgesetzt werden.</p></section>`;safeTex(view);$('#otherPerson').onclick=()=>{try{localStorage.removeItem(`matheQuizRound:${QUIZ.id}`)}catch{}getBrowserId(true);$('#contestForm').elements.name.value='';$('#contestForm').elements.name.focus()};$('#contestForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),name=String(fd.get('name')||'').trim().slice(0,24)||makeAlias(),browserId=getBrowserId();try{const data=await api('/api/v1/competition/start',{method:'POST',body:JSON.stringify({quizId:QUIZ.id,name,className:String(QUIZ.grade),browserId})});if(!data.roundId||!data.question?.id||!Number.isFinite(Date.parse(data.question?.expiresAt)))throw new Error('Unvollständige Wettbewerbsdaten');state.contest={roundId:data.roundId,studentName:name,className:String(QUIZ.grade),browserId};state.round=[data.question];state.index=Number(data.index)||0;state.score=Number(data.totalPoints)||0;state.correct=Number(data.correctCount)||0;state.basePoints=Number(data.basePoints)||0;state.timeBonus=Number(data.timeBonus)||0;state.roundStartedAt=Date.parse(data.roundStartedAt)||Date.now();state.pendingRequestId=null;try{localStorage.setItem(`matheQuizRound:${QUIZ.id}`,JSON.stringify({roundId:data.roundId,browserId,name}))}catch{}showQuestion(data.question)}catch(err){alert('Der Wettbewerbsserver ist gerade nicht erreichbar. Deine Runde wurde nicht lokal gewertet.')}}}
async function submitContestAnswer(q,a){
 clearInterval(state.timer);
 setAnswerControlsDisabled(true);
 state.pendingRequestId=state.pendingRequestId||crypto.randomUUID();
 try{
  const result=await api('/api/v1/competition/answer',{method:'POST',body:JSON.stringify({quizId:QUIZ.id,roundId:state.contest.roundId,questionId:q.id,answer:a,requestId:state.pendingRequestId,browserId:state.contest.browserId})});
  state.pendingRequestId=null;
  state.score=result.totalPoints;
  state.correct=result.correctCount;
  state.basePoints=Number.isFinite(Number(result.basePointsTotal))?Number(result.basePointsTotal):state.basePoints+Number(result.basePoints||0);
  state.timeBonus=Number.isFinite(Number(result.timeBonusTotal))?Number(result.timeBonusTotal):state.timeBonus+Number(result.timeBonus||0);
  const partial=result.isCorrect?1:0;
  markAnswer(q,a,partial);
  const points=Number.isFinite(Number(result.basePoints))?` Punkte: ${result.basePoints} Grundpunkte + ${result.timeBonus||0} Zeitbonus.`:'';
  const fb=$('#feedback');
  fillFeedback(fb,partial===1?'good':'bad',partial===1?'✓':a===null?'⌛':'↺',partial===1?'Richtig! Punkte gesichert.':a===null?'Zeit abgelaufen – weiter geht’s.':'Noch nicht – die Runde geht weiter.',(result.feedback||'Die Wertung wurde vom Server geprüft.')+points);
  $('#check').classList.add('hidden');
  const nextBtn=$('#next');
  nextBtn.classList.remove('hidden');
  nextBtn.onclick=async()=>{
   if(result.finished){try{localStorage.removeItem(`matheQuizRound:${QUIZ.id}`)}catch{}finish();return}
   try{
    const d=await api('/api/v1/competition/next',{method:'POST',body:JSON.stringify({quizId:QUIZ.id,roundId:state.contest.roundId,browserId:state.contest.browserId,questionId:q.id})});
    if(!d.question?.id||!Number.isFinite(Date.parse(d.question?.expiresAt)))throw new Error('Unvollständige Wettbewerbsdaten');
    state.index++;state.pendingRequestId=null;showQuestion(d.question);
   }catch(err){alert('Die nächste Aufgabe konnte nicht geladen werden.')}
  };
  if(result.finished)nextBtn.textContent='Ergebnis ansehen';else nextBtn.focus();
 }catch(err){
  state.locked=false;
  setAnswerControlsDisabled(false);
  const checkButton=$('#check');
  if(checkButton){checkButton.disabled=false;checkButton.textContent='Erneut versuchen'}
  const fb=$('#feedback');
  if(fb)fillFeedback(fb,'waiting','↻','Verbindung unterbrochen.','Deine Eingabe ist noch da. Tippe auf „Erneut versuchen“.');
  alert('Antwort konnte nicht geprüft werden. Deine Eingabe bleibt erhalten. Bitte erneut versuchen.');
 }
}
function startTimer(expiresAt){clearInterval(state.timer);const deadline=Date.parse(expiresAt);if(!Number.isFinite(deadline)){state.locked=true;submitContestAnswer(state.currentQuestion,null);return}const tick=()=>{const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));const el=$('#timerText');if(el){el.textContent=`\\(${left}\\) s`;renderMath(el)}if(left===0){clearInterval(state.timer);$('#check').disabled=true;state.locked=true;setAnswerControlsDisabled(true);submitContestAnswer(state.currentQuestion,null)}};tick();state.timer=setInterval(tick,250)}
function startRoundClock(){clearInterval(state.roundClock);if(!state.roundStartedAt)state.roundStartedAt=Date.now();const tick=()=>{const el=$('#totalTimerText');if(!el)return;const s=Math.floor((Date.now()-state.roundStartedAt)/1000);el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};tick();state.roundClock=setInterval(tick,1000)}
async function api(path,options={}){const r=await fetch(CLOUD.baseUrl.replace(/\/$/,'')+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw new Error('API '+r.status);return r.json()}

function applyTextScale(value,save=true){const scale=Math.max(1,Math.min(1.3,Math.round(Number(value)*10)/10||1));document.documentElement.style.setProperty('--text-scale',String(scale));if(save){try{localStorage.setItem('matheQuizTextScale',String(scale))}catch{}}const down=$('#fontDown'),up=$('#fontUp'),status=$('#fontScaleStatus');if(down)down.disabled=scale<=1;if(up)up.disabled=scale>=1.3;if(status)status.textContent=scale<=1?'Standardschriftgröße':scale<1.2?'Schrift etwas größer':'Schrift deutlich größer';return scale}
function storedTextScale(){try{return Number(localStorage.getItem('matheQuizTextScale'))||1}catch{return 1}}
applyTextScale(storedTextScale(),false);$('#fontDown').onclick=()=>applyTextScale(storedTextScale()-0.1);$('#fontUp').onclick=()=>applyTextScale(storedTextScale()+0.1);
