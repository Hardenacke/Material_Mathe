<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17171c">
  <meta name="description" content="Mathematik entdecken: Kurs, Themenbereich und Materialart auswählen. Lernpfade, Lernspiele, Wiederholung und Zusatzaufgaben übersichtlich finden.">
  <title>Mathematiksammlung</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#catalog">Zum Material springen</a>

  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Mathematik · Materialsammlung</p>
      <h1>Mathematiksammlung</h1>
      <p class="intro">Dein nächster Lernschritt beginnt hier. Wähle deinen Kurs und entdecke passende Themen und Materialien.</p>
      <label class="search-wrap" for="search">
        <span class="sr-only">Materialien durchsuchen</span>
        <input id="search" type="search" placeholder="Klasse, Kurs, Inhaltsfeld, Thema, Methode oder Material suchen ..." autocomplete="off">
      </label>
    </div>
  </header>

  <main class="page-shell">
    <div id="summary" class="summary" aria-live="polite"></div>
    <div id="catalog" class="catalog" tabindex="-1">
      <p class="loading">Verzeichnis wird geladen ...</p>
    </div>
  </main>

  <noscript><p class="empty-state">Bitte aktiviere JavaScript, um Kurse, Themenbereiche und Materialien auszuwählen.</p></noscript>

  <footer class="footer">
    <p>Entdecken · Verstehen · Üben</p>
  </footer>
</body>
</html>
