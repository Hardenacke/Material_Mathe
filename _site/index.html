<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#23454a">
  <meta name="description" content="Mathematik-Materialsammlung mit zweistufiger Auswahl nach Klasse oder Kurs und Inhaltsfeld.">
  <title>Mathematiksammlung</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#catalog">Zum Material springen</a>

  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Mathematik · Materialsammlung</p>
      <h1>Mathematiksammlung</h1>
      <p class="intro">Wähle zuerst eine Klasse oder einen Kurs aus. Danach findest du im Inhaltsfeld die passenden Themen und Dateien.</p>
      <label class="search-wrap" for="search">
        <span class="sr-only">Materialien durchsuchen</span>
        <input id="search" type="search" placeholder="Klasse, Kurs, Inhaltsfeld, Thema oder Material suchen ..." autocomplete="off">
      </label>
    </div>
  </header>

  <main class="page-shell">
    <div id="summary" class="summary" aria-live="polite"></div>
    <div id="catalog" class="catalog" aria-live="polite">
      <p class="loading">Verzeichnis wird geladen ...</p>
    </div>
  </main>

  <footer class="footer">
    <p>Die Übersicht wird automatisch aus der Mathematik-Ordnerstruktur erzeugt.</p>
  </footer>
</body>
</html>
